name: Refresh BetterFPL data

on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SECRET_KEY: ${{ secrets.BETTERFPL_SUPABASE_KEY }}
      SUPABASE_STORAGE_BUCKET: betterfpl-cache

    steps:
      - name: Download the BetterFPL code
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install website dependencies
        run: npm ci

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip

      - name: Install data dependencies
        run: pip install -r requirements.txt

      - name: Check Supabase settings
        shell: bash
        run: |
          missing=0
          if [ -z "$SUPABASE_URL" ]; then
            echo "::error::GitHub did not provide the repository secret SUPABASE_URL."
            missing=1
          else
            echo "SUPABASE_URL is available."
          fi
          if [ -z "$SUPABASE_SECRET_KEY" ]; then
            echo "::error::GitHub did not provide the repository secret BETTERFPL_SUPABASE_KEY."
            missing=1
          else
            echo "BETTERFPL_SUPABASE_KEY is available."
          fi
          exit "$missing"

      - name: Refresh public FPL data
        run: node scripts/refresh-fpl.mjs

      - name: Refresh match analytics
        run: python scripts/refresh-analytics.py

      - name: Refresh WhoScored and Elo enrichment
        run: python scripts/refresh-enrichment.py

      - name: Publish the validated cloud snapshot
        run: node scripts/upload-cloud-snapshot.mjs
